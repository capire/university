<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .entity-header { fill: #2C3E50; }
      .entity-body { fill: #FAFAFA; stroke: #2C3E50; stroke-width: 1.5; }
      .header-text { fill: #FFFFFF; font-size: 15px; font-weight: 600; }
      .field-text { fill: #333333; font-size: 12px; }
      .type-text { fill: #777777; font-size: 11px; }
      .key-text { fill: #E67E22; font-size: 11px; font-weight: 600; }
      .rel-line { stroke: #2C3E50; stroke-width: 1.8; fill: none; }
      .rel-label { fill: #555555; font-size: 11px; font-style: italic; }
      .cardinality { fill: #2C3E50; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#FFFFFF" rx="8"/>

  <!-- ========== PROFESSORS (top-left) ========== -->
  <g transform="translate(40, 40)">
    <rect class="entity-header" width="220" height="34" rx="6" ry="6"/>
    <rect class="entity-header" width="220" height="17" y="17"/>
    <text class="header-text" x="110" y="24" text-anchor="middle">Professors</text>
    <rect class="entity-body" width="220" height="140" y="34" rx="0" ry="0"/>
    <rect class="entity-body" width="220" height="6" y="168" rx="0" ry="6"/>
    <text class="key-text"  x="14" y="56">PK</text><text class="field-text" x="40" y="56">ID</text><text class="type-text" x="160" y="56">UUID</text>
    <text class="field-text" x="14" y="76">firstName</text><text class="type-text" x="160" y="76">String</text>
    <text class="field-text" x="14" y="96">lastName</text><text class="type-text" x="160" y="96">String</text>
    <text class="field-text" x="14" y="116">email</text><text class="type-text" x="160" y="116">String</text>
    <text class="field-text" x="14" y="136">department</text><text class="type-text" x="160" y="136">String</text>
    <text class="type-text" x="14" y="162">managed (createdAt…)</text>
  </g>

  <!-- ========== COURSES (top-right) ========== -->
  <g transform="translate(400, 40)">
    <rect class="entity-header" width="220" height="34" rx="6" ry="6"/>
    <rect class="entity-header" width="220" height="17" y="17"/>
    <text class="header-text" x="110" y="24" text-anchor="middle">Courses</text>
    <rect class="entity-body" width="220" height="160" y="34" rx="0" ry="0"/>
    <rect class="entity-body" width="220" height="6" y="188" rx="0" ry="6"/>
    <text class="key-text"  x="14" y="56">PK</text><text class="field-text" x="40" y="56">ID</text><text class="type-text" x="160" y="56">UUID</text>
    <text class="field-text" x="14" y="76">title</text><text class="type-text" x="160" y="76">String</text>
    <text class="field-text" x="14" y="96">description</text><text class="type-text" x="160" y="96">String</text>
    <text class="field-text" x="14" y="116">credits</text><text class="type-text" x="160" y="116">Integer</text>
    <text class="field-text" x="14" y="136">semester</text><text class="type-text" x="160" y="136">String</text>
    <text class="key-text"  x="14" y="156">FK</text><text class="field-text" x="40" y="156">professor_ID</text><text class="type-text" x="160" y="156">UUID</text>
    <text class="type-text" x="14" y="182">managed (createdAt…)</text>
  </g>

  <!-- ========== STUDENTS (bottom-left) ========== -->
  <g transform="translate(40, 310)">
    <rect class="entity-header" width="220" height="34" rx="6" ry="6"/>
    <rect class="entity-header" width="220" height="17" y="17"/>
    <text class="header-text" x="110" y="24" text-anchor="middle">Students</text>
    <rect class="entity-body" width="220" height="140" y="34" rx="0" ry="0"/>
    <rect class="entity-body" width="220" height="6" y="168" rx="0" ry="6"/>
    <text class="key-text"  x="14" y="56">PK</text><text class="field-text" x="40" y="56">ID</text><text class="type-text" x="160" y="56">UUID</text>
    <text class="field-text" x="14" y="76">firstName</text><text class="type-text" x="160" y="76">String</text>
    <text class="field-text" x="14" y="96">lastName</text><text class="type-text" x="160" y="96">String</text>
    <text class="field-text" x="14" y="116">email</text><text class="type-text" x="160" y="116">String</text>
    <text class="field-text" x="14" y="136">matriculation</text><text class="type-text" x="160" y="136">String</text>
    <text class="type-text" x="14" y="162">managed (createdAt…)</text>
  </g>

  <!-- ========== ENROLLMENTS (bottom-right) ========== -->
  <g transform="translate(400, 310)">
    <rect class="entity-header" width="220" height="34" rx="6" ry="6"/>
    <rect class="entity-header" width="220" height="17" y="17"/>
    <text class="header-text" x="110" y="24" text-anchor="middle">Enrollments</text>
    <rect class="entity-body" width="220" height="140" y="34" rx="0" ry="0"/>
    <rect class="entity-body" width="220" height="6" y="168" rx="0" ry="6"/>
    <text class="key-text"  x="14" y="56">PK</text><text class="field-text" x="40" y="56">ID</text><text class="type-text" x="160" y="56">UUID</text>
    <text class="key-text"  x="14" y="76">FK</text><text class="field-text" x="40" y="76">course_ID</text><text class="type-text" x="160" y="76">UUID</text>
    <text class="key-text"  x="14" y="96">FK</text><text class="field-text" x="40" y="96">student_ID</text><text class="type-text" x="160" y="96">UUID</text>
    <text class="field-text" x="14" y="116">grade</text><text class="type-text" x="160" y="116">String</text>
    <text class="field-text" x="14" y="136">status</text><text class="type-text" x="160" y="136">enum</text>
    <text class="type-text" x="14" y="162">managed (createdAt…)</text>
  </g>

  <!-- ===== RELATIONSHIP LINES ===== -->

  <!-- Professors 1 ──── * Courses -->
  <line class="rel-line" x1="260" y1="130" x2="400" y2="130"/>
  <text class="cardinality" x="270" y="124">1</text>
  <text class="cardinality" x="384" y="124">*</text>

  <!-- Courses 1 ──── * Enrollments (vertical) -->
  <line class="rel-line" x1="510" y1="234" x2="510" y2="310"/>
  <text class="cardinality" x="516" y="252">1</text>
  <text class="cardinality" x="516" y="306">*</text>

  <!-- Students 1 ──── * Enrollments -->
  <line class="rel-line" x1="260" y1="400" x2="400" y2="400"/>
  <text class="cardinality" x="270" y="394">1</text>
  <text class="cardinality" x="384" y="394">*</text>

  <!-- Title -->
  <text x="750" y="500" text-anchor="middle" font-size="11" fill="#999999">University Course Domain Model</text>
</svg>
